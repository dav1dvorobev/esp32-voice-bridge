<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hold Voice Button</title>

        <style>
            :root {
                --bg: #09090d;
                --surface: #15151d;
                --surface-active: #1c1826;
                --text: #f5f3ff;
                --purple: #8b5cf6;
                --purple-soft: #c4b5fd;
                --glow: rgba(139, 92, 246, 0.45);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(
                        circle at 25% 20%,
                        rgba(139, 92, 246, 0.16),
                        transparent 28%
                    ),
                    radial-gradient(
                        circle at 80% 70%,
                        rgba(167, 139, 250, 0.1),
                        transparent 30%
                    ),
                    var(--bg);
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }

            .voice-button {
                position: relative;
                width: 92px;
                height: 92px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 999px;
                background:
                    linear-gradient(
                        180deg,
                        rgba(255, 255, 255, 0.06),
                        rgba(255, 255, 255, 0.02)
                    ),
                    var(--surface);
                color: var(--text);
                cursor: pointer;
                display: grid;
                place-items: center;
                overflow: hidden;
                outline: none;
                box-shadow:
                    0 18px 50px rgba(0, 0, 0, 0.45),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
                transition:
                    width 0.35s ease,
                    border-radius 0.35s ease,
                    background 0.35s ease,
                    box-shadow 0.35s ease;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }

            .voice-button:active,
            .voice-button.is-holding {
                width: 300px;
                border-radius: 30px;
                background:
                    linear-gradient(
                        180deg,
                        rgba(139, 92, 246, 0.18),
                        rgba(139, 92, 246, 0.06)
                    ),
                    var(--surface-active);
                box-shadow:
                    0 22px 70px rgba(0, 0, 0, 0.55),
                    0 0 50px var(--glow),
                    inset 0 1px 0 rgba(255, 255, 255, 0.06);
            }

            .mic-icon {
                position: absolute;
                width: 32px;
                height: 32px;
                opacity: 1;
                transform: scale(1);
                transition:
                    opacity 0.18s ease,
                    transform 0.18s ease;
            }

            .voice-button:active .mic-icon,
            .voice-button.is-holding .mic-icon {
                opacity: 0;
                transform: scale(0.65);
            }

            .wave-box {
                width: 100%;
                height: 100%;
                padding: 0 24px;
                display: flex;
                align-items: center;
                gap: 14px;
                opacity: 0;
                transform: scale(0.96);
                transition:
                    opacity 0.2s ease 0.08s,
                    transform 0.2s ease 0.08s;
                pointer-events: none;
            }

            .voice-button:active .wave-box,
            .voice-button.is-holding .wave-box {
                opacity: 1;
                transform: scale(1);
            }

            .live-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--purple-soft);
                box-shadow: 0 0 18px rgba(196, 181, 253, 0.9);
                flex: 0 0 auto;
                animation: dotPulse 1s ease-in-out infinite;
            }

            .wave {
                flex: 1;
                height: 52px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 5px;
            }

            .wave span {
                width: 5px;
                height: 16px;
                border-radius: 999px;
                background: linear-gradient(
                    180deg,
                    var(--purple-soft),
                    var(--purple)
                );
                box-shadow: 0 0 14px rgba(139, 92, 246, 0.55);
                animation: waveMove 0.9s ease-in-out infinite;
                animation-play-state: paused;
            }

            .voice-button:active .wave span,
            .voice-button.is-holding .wave span {
                animation-play-state: running;
            }

            .wave span:nth-child(1) {
                animation-delay: 0s;
            }
            .wave span:nth-child(2) {
                animation-delay: 0.08s;
            }
            .wave span:nth-child(3) {
                animation-delay: 0.16s;
            }
            .wave span:nth-child(4) {
                animation-delay: 0.24s;
            }
            .wave span:nth-child(5) {
                animation-delay: 0.32s;
            }
            .wave span:nth-child(6) {
                animation-delay: 0.4s;
            }
            .wave span:nth-child(7) {
                animation-delay: 0.48s;
            }
            .wave span:nth-child(8) {
                animation-delay: 0.56s;
            }
            .wave span:nth-child(9) {
                animation-delay: 0.64s;
            }
            .wave span:nth-child(10) {
                animation-delay: 0.72s;
            }
            .wave span:nth-child(11) {
                animation-delay: 0.8s;
            }
            .wave span:nth-child(12) {
                animation-delay: 0.88s;
            }

            .ring,
            .ring::before,
            .ring::after {
                content: "";
                position: absolute;
                inset: -10px;
                border-radius: inherit;
                border: 1px solid rgba(139, 92, 246, 0);
                opacity: 0;
                pointer-events: none;
            }

            .voice-button:active .ring,
            .voice-button.is-holding .ring {
                animation: ringPulse 1.8s ease-out infinite;
            }

            .voice-button:active .ring::before,
            .voice-button.is-holding .ring::before {
                animation: ringPulse 1.8s ease-out infinite 0.45s;
            }

            .voice-button:active .ring::after,
            .voice-button.is-holding .ring::after {
                animation: ringPulse 1.8s ease-out infinite 0.9s;
            }

            @keyframes waveMove {
                0%,
                100% {
                    height: 14px;
                    opacity: 0.55;
                }

                50% {
                    height: 48px;
                    opacity: 1;
                }
            }

            @keyframes dotPulse {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 1;
                }

                50% {
                    transform: scale(1.25);
                    opacity: 0.65;
                }
            }

            @keyframes ringPulse {
                0% {
                    opacity: 0.55;
                    transform: scale(0.95);
                    border-color: rgba(139, 92, 246, 0.32);
                }

                100% {
                    opacity: 0;
                    transform: scale(1.14);
                    border-color: rgba(139, 92, 246, 0);
                }
            }
        </style>
    </head>

    <body>
        <button
            class="voice-button"
            id="voiceButton"
            aria-label="Зажми для записи"
        >
            <span class="ring"></span>

            <svg class="mic-icon" viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 14.75a4 4 0 0 0 4-4V7a4 4 0 1 0-8 0v3.75a4 4 0 0 0 4 4Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />
                <path
                    d="M19 10.75a7 7 0 0 1-14 0M12 17.75V21M8.75 21h6.5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />
            </svg>

            <div class="wave-box">
                <span class="live-dot"></span>

                <div class="wave">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </button>

        <script>
            const button = document.getElementById("voiceButton");
            function holdStart(event) {
                event.preventDefault();
                button.classList.add("is-holding");
                button.setPointerCapture?.(event.pointerId);
            }
            function holdEnd(event) {
                event.preventDefault();
                button.classList.remove("is-holding");
                button.releasePointerCapture?.(event.pointerId);
            }
            button.addEventListener("pointerdown", holdStart);
            button.addEventListener("pointerup", holdEnd);
            button.addEventListener("pointerleave", holdEnd);
            button.addEventListener("pointercancel", holdEnd);
        </script>
    </body>
</html>
