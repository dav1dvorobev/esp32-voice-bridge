<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/app.css" />
        <script src="/app.js" defer></script>
    </head>

    <body>
        <main class="stage">
            <input
                class="esp32-address"
                id="esp32Address"
                type="url"
                inputmode="url"
                autocomplete="off"
                spellcheck="false"
                aria-label="ESP32 address"
                placeholder="192.168.1.84"
            />

            <div class="voice-shell" id="voiceShell">
                <button
                    class="voice-button"
                    id="voiceButton"
                    aria-label="Зажми для записи"
                >
                    <span class="ring"></span>

                    <svg class="mic-icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M12 14.75a4 4 0 0 0 4-4V7a4 4 0 1 0-8 0v3.75a4 4 0 0 0 4 4Z"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                        <path
                            d="M19 10.75a7 7 0 0 1-14 0M12 17.75V21M8.75 21h6.5"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>

                    <div class="wave-box">
                        <span class="live-dot"></span>

                        <div class="wave">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </button>
            </div>
        </main>
    </body>
</html>
